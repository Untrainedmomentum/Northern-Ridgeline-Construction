name: Qualify Untrained Momentum site credit
on:
  push:
    paths: ['.github/workflows/qualify-untrained-momentum-credit.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules','_site','dist','build'} for x in p.parts): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              old='<a href="https://untrainedmomentum.com/website-design-big-rapids-michigan.html" style='
              new='<a href="https://untrainedmomentum.com/website-design-big-rapids-michigan.html" rel="nofollow" style='
              if old in s: p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/qualify-untrained-momentum-credit.yml
          git commit -m "Qualify Built by Untrained Momentum credit link"
          git push
