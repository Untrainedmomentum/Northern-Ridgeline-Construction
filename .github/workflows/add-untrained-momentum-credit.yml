name: Add Untrained Momentum site credit

on:
  push:
    paths:
      - '.github/workflows/add-untrained-momentum-credit.yml'

permissions:
  contents: write

jobs:
  add-credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add branded footer credit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          credit = '<p class="um-site-credit" style="margin:1rem 0 0;font-size:.8rem;opacity:.75">Built by <a href="https://untrainedmomentum.com/website-design-big-rapids-michigan.html" style="color:inherit;text-decoration:underline">Untrained Momentum</a></p>'
          changed = 0
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules', '_site', 'dist', 'build'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'Built by <a href="https://untrainedmomentum.com/' in text:
                  continue
              lower = text.lower()
              pos = lower.rfind('</footer>')
              if pos >= 0:
                  text = text[:pos] + credit + '\n' + text[pos:]
              else:
                  pos = lower.rfind('</body>')
                  if pos < 0:
                      continue
                  text = text[:pos] + credit + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed += 1
          print(f'Updated {changed} HTML file(s).')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/add-untrained-momentum-credit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Built by Untrained Momentum footer credit"
          git push
